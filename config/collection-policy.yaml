mode: passive_manual_import_only
network_collection_enabled: false
allowed_organization_domains:
  - fbsu.edu.sa
  - diplomas.fbsu.edu.sa
  - students.fbsu.edu.sa
  - assessments.fbsu.edu.sa
  - graduate.fbsu.edu.sa
  - ncaaa.fbsu.edu.sa
  - csc.fbsu.edu.sa
  - forms.fbsu.edu.sa
  - elearning.fbsu.edu.sa
  - dlms.fbsu.edu.sa
new_subdomains: candidate_requires_ownership_verification
discovered_ip_addresses: never_auto_authorize
third_party_services: require_ownership_and_written_authorization
prohibited:
  - exploitation
  - authentication_bypass
  - password_attacks
  - privilege_escalation
  - data_extraction
  - persistence
  - restricted_administrative_interfaces
  - security_control_or_rate_limit_bypass
  - script_execution_from_target
  - collection_of_credentials_tokens_cookies_or_personal_records
metadata_handling:
  fetch_automatically: false
  store_response_bodies: false
  record_only: [availability, http_status, content_type, response_size, timestamp, source_url]
